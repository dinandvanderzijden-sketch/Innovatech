plugin: amazon.aws.aws_ec2

regions:
  - eu-central-1

filters:
  tag:Project: cs2
  tag:Environment: dev
  instance-state-name: running

keyed_groups:
  - prefix: role
    key: tags.Role
    default: unknown
  - prefix: os
    key: tags.OS
    default: linux

hostnames:
  - private-ip-address

compose:
  ansible_host: private_ip_address

groups:
  workload: "tags.Role == 'workload'"
  platform: "tags.Role == 'platform'"
