plugin: amazon.aws.aws_ec2

regions:
  - eu-central-1

filters:
  tag:Project: cs2
  tag:Environment: dev
  instance-state-name: running

keyed_groups:
  - prefix: role
    key: tags.Role
    default: unknown
  - prefix: os
    key: tags.OS
    default: linux

hostnames:
  - private-ip-address

compose:
  ansible_host: private_ip_address
  ansible_user: "'ec2-user'"
  ansible_ssh_private_key_file: "'/home/ec2-user/.ssh/ansible'"

groups:
  workload: "tags.Role == 'workload'"
  platform: "tags.Role == 'platform'"
