---
- name: Controleer het besturingssysteem
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
    fail_msg: "Deze rol is alleen getest op Amazon Linux 2023."
    quiet: true

- name: Installeer basispakketten
  ansible.builtin.dnf:
    name:
      - chrony
      - rsyslog
      - vim-enhanced
      - htop
      - jq
      - tar
      - unzip
      - dnf-plugins-core
    state: present

- name: Zorg dat rsyslog draait
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true
