name: Terraform (optioneel)

# Alleen actief als je een S3-backend hebt geconfigureerd en de repository-
# variabelen TF_STATE_BUCKET en TF_STATE_KEY hebt gezet. Voor de demo is
# lokaal `terraform apply` de normale route.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Ook echt toepassen (anders alleen plannen)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    if: vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Controleer AWS-rol
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::De repository-secret AWS_ROLE_ARN ontbreekt. Zet hem op de waarde van 'terraform -chdir=infra output -raw github_role_arn'."
            exit 1
          fi
          echo "OIDC-rol: $ROLE_ARN"

      - name: AWS-rechten via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init met S3-backend
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: ${{ inputs.apply }}
        run: terraform apply -input=false -auto-approve tfplan
