name: Deploy

# Push naar main = uitrollen. De tests draaien eerst; alleen als die slagen
# gaat Terraform naar AWS en wordt daarna de SOAR-image gebouwd en uitgerold.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "bootstrap/**"
      - "soar/**"
      - "lambda/**"
      - "grafana/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Dezelfde groep als de destroy-workflow: die twee mogen nooit samen lopen.
concurrency:
  group: cs2-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  STATE_BUCKET: cs2-dev-tfstate-491799435972

jobs:
  test:
    name: Tests en validatie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: soar/requirements*.txt

      - name: Afhankelijkheden installeren
        working-directory: soar
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        working-directory: soar
        run: pytest -q

      - name: Website-code compileren
        run: python -m py_compile webapp/app.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: Opmaak controleren
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Init zonder backend
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Valideren
        working-directory: infra
        run: terraform validate -no-color

  deploy:
    name: Terraform apply en SOAR uitrollen
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: AWS-rechten via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN || 'arn:aws:iam::491799435972:role/cs2-dev-github' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: State-bucket garanderen
        working-directory: .
        run: |
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "State-bucket ontbreekt; aanmaken."
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: SOAR-image bouwen en uitrollen
        working-directory: .
        run: ./scripts/build_codebuild.sh

      - name: Samenvatting
        working-directory: .
        run: |
          echo "### Uitgerold" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=infra output >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
