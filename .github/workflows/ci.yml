name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt en validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: Opmaak controleren
        run: terraform fmt -check -recursive

      - name: Init zonder backend
        run: terraform init -backend=false

      - name: Valideren
        run: terraform validate

  soar:
    name: SOAR tests en image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: soar/requirements*.txt

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests uitvoeren
        run: pytest -q

      - name: Website-code compileren
        working-directory: ..
        run: python -m py_compile webapp/app.py

      - name: Image bouwen (zonder push)
        run: docker build -t cs2-soar:ci .
