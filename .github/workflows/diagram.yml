name: Terraform-diagram (Rover)

# Maakt Rover-visualisaties van de Terraform-configuratie en commit ze naar
# docs/diagram/. Eén volledige plan wordt gefilterd per laag, zodat elk
# diagram leesbaar is. Draait met OIDC, zonder vaste AWS-sleutels.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagram.yml"

permissions:
  id-token: write
  contents: write

concurrency:
  group: diagram
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  ROVER_VERSION: "0.3.3"

jobs:
  rover:
    name: Rover-diagrammen maken
    # 22.04: op 24.04 blokkeert AppArmor de Chrome-sandbox die Rover voor -genImage gebruikt.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: AWS-rechten via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN || 'arn:aws:iam::491799435972:role/cs2-dev-github' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init en volledige plan
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra plan -input=false -lock-timeout=60s -out=plan.out
          terraform -chdir=infra show -json plan.out > plan.json

      - name: Rover downloaden
        run: |
          curl -fsSL -o rover.zip \
            "https://github.com/im2nguyen/rover/releases/download/v${ROVER_VERSION}/rover_${ROVER_VERSION}_linux_amd64.zip"
          unzip -o rover.zip
          mv "rover_v${ROVER_VERSION}" rover
          chmod +x rover

      - name: Plan per laag filteren
        run: python3 scripts/rover_layers.py plan.json

      - name: Rover per laag
        run: |
          mkdir -p docs/diagram/rover
          for f in rover-plans/*.json; do
            name="$(basename "$f" .json)"
            echo "== $name =="
            if ./rover -planJSONPath="$f" -genImage true >"docs/diagram/rover/$name.log" 2>&1 \
               && [ -f rover.svg ]; then
              mv rover.svg "docs/diagram/rover/$name.svg"
              rm -f "docs/diagram/rover/$name.log"
            else
              echo "Rover faalde voor $name; log wordt bewaard."
            fi
          done
          ls -la docs/diagram/rover/

      - name: Volledige graaf
        run: |
          if ./rover -planJSONPath=plan.json -genImage true; then
            cp rover.svg docs/diagram/terraform-rover.svg
          else
            echo "Volledige Rover-graaf mislukt."
          fi

      - name: PNG-previews maken
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          for f in docs/diagram/rover/*.svg; do
            rsvg-convert -w 2000 "$f" -o "${f%.svg}.png"
          done
          if [ -f docs/diagram/terraform-rover.svg ]; then
            rsvg-convert -w 2400 docs/diagram/terraform-rover.svg -o docs/diagram/terraform-rover.png
          fi

      - name: Diagrammen committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagram
          if git diff --cached --quiet; then
            echo "Geen wijziging in de diagrammen."
          else
            git commit -m "Diagrammen: Rover per laag bijgewerkt"
            git push
          fi
