name: Terraform-diagram (Rover)

# Maakt Rover-visualisaties van de Terraform-configuratie en commit ze naar
# docs/diagram/. Per laag een gerichte plan, zodat elk diagram leesbaar is,
# plus één volledige graaf. Draait met OIDC, zonder vaste AWS-sleutels.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagram.yml"

permissions:
  id-token: write
  contents: write

concurrency:
  group: diagram
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  ROVER_VERSION: "0.3.3"

jobs:
  rover:
    name: Rover-diagrammen maken
    # 22.04: op 24.04 blokkeert AppArmor de Chrome-sandbox die Rover voor -genImage gebruikt.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: AWS-rechten via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN || 'arn:aws:iam::491799435972:role/cs2-dev-github' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Rover downloaden
        run: |
          curl -fsSL -o rover.zip \
            "https://github.com/im2nguyen/rover/releases/download/v${ROVER_VERSION}/rover_${ROVER_VERSION}_linux_amd64.zip"
          unzip -o rover.zip
          mv "rover_v${ROVER_VERSION}" rover
          chmod +x rover

      - name: Rover per laag
        run: |
          set -u
          mkdir -p docs/diagram/rover

          build() {
            name="$1"; shift
            args=()
            for t in "$@"; do args+=("-target=$t"); done
            echo "== $name =="
            if ! terraform -chdir=infra plan -input=false -lock-timeout=60s \
                 "${args[@]}" -out="plan-$name.out"; then
              echo "plan voor $name mislukt; laag overgeslagen"
              return 0
            fi
            terraform -chdir=infra show -json "plan-$name.out" > "plan-$name.json"
            if ! ./rover -planJSONPath="plan-$name.json" -genImage true; then
              echo "Rover voor $name mislukt; laag overgeslagen"
              return 0
            fi
            mv rover.svg "docs/diagram/rover/$name.svg"
          }

          build netwerk \
            aws_vpc.platform aws_vpc.workload aws_ec2_transit_gateway.this \
            aws_subnet.platform aws_subnet.workload_private \
            aws_nat_gateway.platform aws_nat_gateway.workload \
            aws_internet_gateway.platform aws_internet_gateway.workload \
            aws_route53_zone.internal

          build beveiliging \
            aws_security_group.alb aws_security_group.aurora aws_security_group.lambda \
            aws_security_group.observability aws_security_group.runner \
            aws_security_group.soar aws_security_group.web_db aws_security_group.workload \
            aws_key_pair.ansible aws_lambda_function.firewall_api \
            aws_api_gateway_rest_api.firewall aws_api_gateway_resource.block \
            aws_api_gateway_method.block aws_api_gateway_integration.block \
            aws_api_gateway_deployment.firewall aws_api_gateway_stage.firewall \
            aws_api_gateway_api_key.firewall aws_api_gateway_usage_plan.firewall \
            aws_api_gateway_usage_plan_key.firewall aws_lambda_permission.firewall_api \
            aws_cloudwatch_log_group.firewall_lambda aws_dynamodb_table.blocked_ips

          build websites \
            aws_instance.workload aws_lb.soar aws_lb_listener.web \
            aws_lb_target_group.web aws_lb_target_group_attachment.web \
            aws_security_group.alb aws_security_group.workload aws_key_pair.ansible \
            aws_s3_object.webapp

          build databases \
            aws_rds_cluster.soar aws_rds_cluster.web \
            aws_rds_cluster_instance.writer aws_rds_cluster_instance.reader \
            aws_rds_cluster_instance.web aws_db_subnet_group.aurora \
            aws_security_group.aurora aws_security_group.web_db

          build soar \
            aws_ecs_cluster.soar aws_ecs_service.soar aws_ecs_task_definition.soar \
            aws_lb.soar aws_lb_listener.http aws_lb_target_group.soar \
            aws_sqs_queue.events aws_sqs_queue.events_dlq \
            aws_cloudwatch_event_rule.alarm aws_cloudwatch_event_rule.finding \
            aws_lambda_function.firewall_api aws_api_gateway_rest_api.firewall \
            aws_dynamodb_table.blocked_ips aws_dynamodb_table.dedupe aws_sns_topic.alerts

          build observability \
            aws_instance.observability aws_cloudwatch_log_group.soar \
            aws_cloudwatch_log_group.flow_logs \
            aws_cloudwatch_metric_alarm.workload_cpu \
            aws_cloudwatch_metric_alarm.workload_no_data \
            aws_s3_bucket.loki aws_s3_bucket.artifacts \
            aws_route53_record.grafana aws_route53_record.loki aws_route53_record.prometheus

          build opslag \
            aws_s3_bucket.audit aws_s3_bucket.loki aws_s3_bucket.artifacts \
            aws_s3_bucket_versioning.audit aws_s3_bucket_versioning.loki \
            aws_s3_bucket_versioning.artifacts \
            aws_s3_bucket_lifecycle_configuration.audit \
            aws_s3_bucket_lifecycle_configuration.loki \
            aws_s3_bucket_server_side_encryption_configuration.audit \
            aws_s3_bucket_server_side_encryption_configuration.loki \
            aws_s3_bucket_server_side_encryption_configuration.artifacts \
            aws_s3_bucket_public_access_block.audit \
            aws_s3_bucket_public_access_block.loki \
            aws_s3_bucket_public_access_block.artifacts \
            aws_s3_bucket_object_lock_configuration.audit

          ls -la docs/diagram/rover/

      - name: Volledige graaf
        run: |
          terraform -chdir=infra plan -input=false -lock-timeout=60s -out=plan.out
          terraform -chdir=infra show -json plan.out > plan.json
          if ./rover -planJSONPath=plan.json -genImage true; then
            mkdir -p docs/diagram
            cp rover.svg docs/diagram/terraform-rover.svg
          else
            echo "Volledige Rover-graaf mislukt; alleen de laagdiagrammen zijn bijgewerkt."
          fi

      - name: Diagrammen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagram
          if git diff --cached --quiet; then
            echo "Geen wijziging in de diagrammen."
          else
            git commit -m "Diagrammen: Rover per laag bijgewerkt"
            git push
          fi
