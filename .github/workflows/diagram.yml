name: Terraform-diagram (Rover)

# Maakt één Rover-visualisatie van de kern van de omgeving en commit de SVG
# naar docs/diagram/. De plan wordt tegen een lege diagram-state gemaakt,
# zodat het diagram laat zien wat de code bouwt (groene creates).
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagram.yml"
      - "infra/**"
      - "scripts/rover_core.py"
      - "scripts/rover_file_map.py"

permissions:
  id-token: write
  contents: write

concurrency:
  group: diagram
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  ROVER_VERSION: "0.3.3"

jobs:
  rover:
    name: Rover-diagram maken
    # 22.04: op 24.04 blokkeert AppArmor de Chrome-sandbox die Rover voor -genImage gebruikt.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: AWS-rechten via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN || 'arn:aws:iam::491799435972:role/cs2-dev-github' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan tegen een lege diagram-state
        run: |
          terraform -chdir=infra init -input=false -reconfigure \
            -backend-config="key=cs2/dev/diagram.tfstate"
          terraform -chdir=infra plan -input=false -lock-timeout=60s -out=plan-diagram.out
          terraform -chdir=infra show -json plan-diagram.out > plan.json

      - name: Rover downloaden
        run: |
          curl -fsSL -o rover.zip \
            "https://github.com/im2nguyen/rover/releases/download/v${ROVER_VERSION}/rover_${ROVER_VERSION}_linux_amd64.zip"
          unzip -o rover.zip
          mv "rover_v${ROVER_VERSION}" rover
          chmod +x rover

      - name: Kern filteren
        run: python3 scripts/rover_core.py plan.json

      - name: Groeperen per bronbestand
        run: |
          python3 -m pip install --quiet python-hcl2
          python3 scripts/rover_file_map.py plan-core.json

      - name: Rover draaien
        run: |
          if ! ./rover -planJSONPath=plan-files.json -genImage true; then
            echo "Bestandsgroepering mislukt; terug naar de kern."
            ./rover -planJSONPath=plan-core.json -genImage true
          fi
          mkdir -p docs/diagram
          cp rover.svg docs/diagram/terraform-rover.svg
          ls -lh docs/diagram/terraform-rover.svg

      - name: PNG-preview maken
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 2400 docs/diagram/terraform-rover.svg -o docs/diagram/terraform-rover.png

      - name: Diagrammen committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagram
          if git diff --cached --quiet; then
            echo "Geen wijziging in het diagram."
          else
            git commit -m "Diagram: Rover-overzicht bijgewerkt"
            git push
          fi
