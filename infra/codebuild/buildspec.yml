version: 0.2

# Wordt door CodeBuild uitgevoerd. De broncode is een zip van soar/ zonder
# de map eromheen, dus de Dockerfile staat in de root van de werkmap.
phases:
  pre_build:
    commands:
      - echo "Inloggen op ECR"
      - REGISTRY=$(echo "$ECR_REPO" | cut -d/ -f1)
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
  build:
    commands:
      - echo "Image bouwen"
      - docker build --platform linux/amd64 -t "$ECR_REPO:$IMAGE_TAG" .
      - docker tag "$ECR_REPO:$IMAGE_TAG" "$ECR_REPO:latest"
  post_build:
    commands:
      - echo "Image pushen"
      - docker push "$ECR_REPO:$IMAGE_TAG"
      - docker push "$ECR_REPO:latest"
      - echo "Build en push klaar voor $ECR_REPO"
