name: Infrastructure (Terraform)

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_WORKING_DIR: infra/envs/prod
  AWS_REGION: eu-west-1        # CHANGE_ME als je een andere regio gebruikt
  AWS_DEFAULT_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      - name: Plan als commentaar in de pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(process.env.TF_WORKING_DIR + '/plan.txt', 'utf8');
            const body = '### Terraform plan\n```\n' + plan.slice(-60000) + '\n```';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Bewaar plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan

  apply:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    environment: prod   # stel in GitHub Environment "prod" een verplichte reviewer in = handmatige goedkeuring
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform apply (goedgekeurd plan)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -lock-timeout=5m tfplan
